<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Ultra-simple for 16px: 4 colored squares on blue bg -->
  <rect width="16" height="16" rx="3" fill="#1a73e8"/>
  <rect x="2" y="2" width="5" height="5" rx="1.5" fill="#ffffff"/>
  <rect x="9" y="2" width="5" height="5" rx="1.5" fill="rgba(255,255,255,0.8)"/>
  <rect x="2" y="9" width="5" height="5" rx="1.5" fill="rgba(255,255,255,0.8)"/>
  <rect x="9" y="9" width="5" height="5" rx="1.5" fill="rgba(255,255,255,0.6)"/>
</svg>
