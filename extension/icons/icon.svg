<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#4285f4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Tab group grid - simplified large shapes -->
  <rect x="18" y="18" width="42" height="42" rx="10" fill="#ffffff"/>
  <rect x="68" y="18" width="42" height="42" rx="10" fill="rgba(255,255,255,0.85)"/>
  <rect x="18" y="68" width="42" height="42" rx="10" fill="rgba(255,255,255,0.85)"/>
  <rect x="68" y="68" width="42" height="42" rx="10" fill="rgba(255,255,255,0.65)"/>
  <!-- Color indicators on each card -->
  <rect x="26" y="26" width="16" height="4" rx="2" fill="#1e8e3e"/>
  <rect x="76" y="26" width="16" height="4" rx="2" fill="#f9ab00"/>
  <rect x="26" y="76" width="16" height="4" rx="2" fill="#d93025"/>
  <rect x="76" y="76" width="16" height="4" rx="2" fill="#9334e6"/>
</svg>
